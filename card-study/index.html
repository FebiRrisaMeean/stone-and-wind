<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Эверделл — 64 карты и компоненты</title><link rel="stylesheet" href="../game/assets/cards64/fonts/fonts.css?v=deck-1"><link rel="stylesheet" href="./study.css?v=deck-1"></head><body>
<header><div><p class="eyebrow">Эверделл · библиотека компонентов</p><h1>64 карты из твоего PDF</h1></div><a href="../?v=pages-15">К игре ↗</a></header>
<main>
<section class="comparison">
 <div class="toolbar"><div class="picker"><button id="previous" aria-label="Предыдущая карта">←</button><select id="card-select" aria-label="Карта"></select><button id="next" aria-label="Следующая карта">→</button></div><div class="switcher" role="group" aria-label="Размер карты"><button data-width="286">286 px</button><button data-width="344" aria-pressed="true">344 px</button></div></div>
 <div class="compare-grid"><figure><div id="source-card"></div><figcaption>Оригинал из PDF <span id="source-page"></span></figcaption></figure><figure><div id="candidate-card"></div><figcaption>Собрано из компонентов</figcaption></figure><aside class="anatomy"><h2 id="selected-title"></h2><p id="selected-type" class="muted"></p><div id="layer-controls"></div><label class="check"><input id="overlay" type="checkbox"> Наложить оригинал</label><label class="check"><input id="guides" type="checkbox"> Границы слоёв</label><p class="source-note">Исходные шрифты, иконки и графика<br>Текст и графические слои независимы</p><button id="restore-layers" class="text-button">Показать все слои</button></aside></div>
 <p id="error" role="alert" hidden></p>
</section>
<section class="parts-section"><div class="section-line"><h2>Компоненты отдельно</h2><p>Один набор слоёв для всей колоды</p></div><div id="part-switcher" class="part-switcher" role="group" aria-label="Компонент"></div><div class="part-comparison"><figure><div id="part-source" class="part-window"></div><figcaption>Фрагмент оригинала</figcaption></figure><figure><div id="part-assembled" class="part-window"></div><figcaption>Тот же фрагмент в сборке</figcaption></figure><figure><div id="part-isolated" class="part-window checker"></div><figcaption>Компонент на прозрачном фоне</figcaption></figure></div></section>
<section><div class="section-line"><div><h2>Вся колода</h2><p id="deck-count">64 карты</p></div><input id="search" type="search" placeholder="Найти карту" aria-label="Найти карту"></div><div class="filters" role="group" aria-label="Набор карт"><button data-filter="all" aria-pressed="true">Все 64</button><button data-filter="base">Базовые 48</button><button data-filter="extra">Дополнительные 16</button></div><div id="deck-grid" class="deck-grid"></div><p id="empty" class="muted" hidden>Таких карт нет</p></section>
</main><script type="module" src="./study.js?v=deck-1"></script></body></html>
