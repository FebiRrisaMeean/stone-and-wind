<!doctype html><html lang="ru"><meta charset="utf-8"><title>Кран — сравнение моделей</title><style>*{box-sizing:border-box}body{margin:0;background:#ede8da;color:#303b31;font:16px system-ui}header{padding:18px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}h1{font:26px Georgia;margin:0}button,a{color:inherit}button{background:#fff9e9;border:1px solid #aaa58e;border-radius:8px;padding:10px 16px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;padding:0 20px}.tile{background:#d6d8cb;border-radius:12px;overflow:hidden}h2{margin:14px 18px;font:22px Georgia}.view{height:60vh;min-height:350px}.stats{padding:12px 18px;background:#faf5e8;min-height:65px;line-height:1.6}footer{padding:18px 24px}canvas{display:block;width:100%;height:100%}.note{max-width:900px;line-height:1.5}</style><header><h1>Кран</h1><button id="front">Спереди</button><button id="back">Сзади</button><button id="rotate">Вращение</button><button id="size">Игровой размер</button><button id="motion">Движение</button><a href="reference.png" target="_blank">Референс Meshy</a></header><main class="grid" id="grid"></main><footer class="note" id="note">Одинаковые камера, освещение и высота моделей • Meshy генерируется</footer><script type="module">
import * as T from '../vendor/three.module.js';import{GLTFLoader}from'../vendor/addons/loaders/GLTFLoader.js';import{createArchitecture,animateArchitecture}from'../game/architecture-models.js';
const panels=[];let angle=.45,spin=false,small=false,motion=true;
async function add(title,object,animations=[],original=false,bytes=0){const tile=document.createElement('section');tile.className='tile';tile.innerHTML=`<h2>${title}</h2><div class="view"></div><div class="stats"></div>`;grid.append(tile);const el=tile.querySelector('.view'),scene=new T.Scene();scene.background=new T.Color('#c2c7bb');const camera=new T.PerspectiveCamera(35,1,.1,100),renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(2,devicePixelRatio));el.append(renderer.domElement);scene.add(new T.HemisphereLight(0xffffff,0x6d735b,2));const light=new T.DirectionalLight(0xffffff,2.8);light.position.set(-3,6,5);scene.add(light);let tris=0,meshes=0;object.traverse(o=>{if(o.isMesh){tris+=(o.geometry.index?.count??o.geometry.attributes.position.count)/3;meshes++}});const wrapper=new T.Group();if(original)object.rotation.y=Math.PI;wrapper.add(object);object.updateMatrixWorld(true);const b=new T.Box3().setFromObject(object),sz=b.getSize(new T.Vector3()),c=b.getCenter(new T.Vector3());const scale=2.8/sz.y;object.scale.multiplyScalar(scale);object.position.set(-c.x*scale,-b.min.y*scale,-c.z*scale);scene.add(wrapper);const floor=new T.Mesh(new T.CircleGeometry(4,64),new T.MeshStandardMaterial({color:0xa9af9c}));floor.rotation.x=-Math.PI/2;floor.position.y=-.01;scene.add(floor);const mixer=animations.length?new T.AnimationMixer(object):null;if(mixer)for(const clip of animations)mixer.clipAction(clip).play();tile.querySelector('.stats').textContent=`${Math.round(tris).toLocaleString('ru')} треугольников · ${meshes} ${meshes===1?'меш':'мешей'}${bytes?' · '+(bytes/1048576).toFixed(2)+' МБ':''} · ${mixer||original?'есть анимация':'без анимации'}`;panels.push({renderer,el,scene,camera,wrapper,object,mixer,original})}
if(!location.search.includes('hybrid'))await add('Текущий Кран',createArchitecture('Crane'),[],true);const loader=new GLTFLoader(),res=await fetch('blender.glb'),buf=await res.arrayBuffer(),g=await loader.parseAsync(buf,location.href);await add('Blender',g.scene,g.animations,false,buf.byteLength);
try{const res=await fetch('meshy.glb');if(res.ok){const buf=await res.arrayBuffer(),g=await loader.parseAsync(buf,location.href);await add('Meshy',g.scene,g.animations,false,buf.byteLength);grid.style.gridTemplateColumns='repeat(3,minmax(0,1fr))';note.textContent='Одинаковые камера, освещение и высота моделей • вращение доступно для проверки всех сторон'}}catch{}
if(location.search.includes('hybrid')){const r=await fetch('hybrid.glb'),b=await r.arrayBuffer(),g=await loader.parseAsync(b,location.href);await add('Meshy + Blender',g.scene,g.animations,false,b.byteLength)}
front.onclick=()=>{angle=0;spin=false};back.onclick=()=>{angle=Math.PI;spin=false};rotate.onclick=()=>{spin=!spin;rotate.textContent=spin?'Остановить вращение':'Вращение'};size.onclick=()=>{small=!small;size.textContent=small?'Крупно':'Игровой размер'};document.querySelector('#motion').onclick=e=>{motion=!motion;e.target.textContent=motion?'Движение':'Включить движение'};let prev=0;function tick(ms){const dt=Math.min(.05,(ms-prev)/1000);prev=ms;if(spin)angle+=dt*.35;for(const p of panels){const w=p.el.clientWidth,h=p.el.clientHeight;p.renderer.setSize(w,h,false);p.camera.aspect=w/h;p.camera.position.set(0,2.1,small?Math.max(19,12/p.camera.aspect):Math.max(6.4,4.8/p.camera.aspect));p.camera.lookAt(0,1.4,0);p.camera.updateProjectionMatrix();p.wrapper.rotation.y=angle;if(motion){p.mixer?.update(dt);if(p.original)animateArchitecture(p.object,ms/1000)}p.renderer.render(p.scene,p.camera)}requestAnimationFrame(tick)}requestAnimationFrame(tick)
</script></html>
